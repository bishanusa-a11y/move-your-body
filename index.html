<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1257A5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Move">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon2-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon2.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;background:#F1F4F9}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.MYB_STATIC = true;</script>
</head>
<body>
<title>Move Your Body</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F1F4F9; --surface:#FFFFFF; --surface2:#E7EDF6; --ink:#131C2B; --ink2:#4B5972; --muted:#7B889E;
  --line:#D6DEEA; --accent:#1257A5; --accent-ink:#FFFFFF; --accent-soft:#DBE9FA; --good:#1E7A62; --good-soft:#D7EFE8;
  --warn:#8A5A12; --warn-soft:#F6EAD4; --bad:#B3261E; --bad-soft:#F9E1DF; --band:#D7EFE8; --grid:#E3E9F2; --shadow:0 1px 2px rgba(19,28,43,.06),0 8px 24px -12px rgba(19,28,43,.20);
  --display:'Syne',system-ui,sans-serif; --body:'Manrope',system-ui,-apple-system,Segoe UI,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1621; --surface:#18212F; --surface2:#222D3E; --ink:#EAF0F8; --ink2:#AEBCCE; --muted:#7C8A9E;
    --line:#2E3B4E; --accent:#5AA0F0; --accent-ink:#08131F; --accent-soft:#17304C; --good:#4FBFA0; --good-soft:#14332C;
    --warn:#DDA94E; --warn-soft:#382E19; --bad:#F28B82; --bad-soft:#3E1F1E; --band:#14332C; --grid:#26323F; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
    --bg:#0F1621; --surface:#18212F; --surface2:#222D3E; --ink:#EAF0F8; --ink2:#AEBCCE; --muted:#7C8A9E;
  --line:#2E3B4E; --accent:#5AA0F0; --accent-ink:#08131F; --accent-soft:#17304C; --good:#4FBFA0; --good-soft:#14332C;
  --warn:#DDA94E; --warn-soft:#382E19; --bad:#F28B82; --bad-soft:#3E1F1E; --band:#14332C; --grid:#26323F; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:12px calc(84px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px;font-weight:800}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:6px 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;flex:none}
h1{font-size:20px}
@media (max-width:400px){h1{font-size:18px}.logo{width:34px;height:34px}}
.top .date{color:var(--ink2);font-size:13px}
.sync{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;text-align:right;flex:none;max-width:38%}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.on::before{background:var(--good)}
.sync.err::before{background:var(--warn)}

/* summary strip */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.strip>div{background:var(--surface);padding:12px 12px 10px;min-width:0}
.strip .v{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1;margin-top:2px}
.strip .v small{font-family:var(--body);font-weight:600;font-size:12px;color:var(--ink2);margin-left:2px}
.strip .d{font-size:12px;color:var(--ink2);margin-top:2px}
.down{color:var(--good)} .up{color:var(--warn)}
@media (max-width:520px){.strip{grid-template-columns:repeat(2,1fr)}}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.nav button{background:none;border:0;border-radius:10px;padding:8px 4px 6px;color:var(--muted);font-weight:600;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

section.screen{padding-top:18px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card.lift{box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--ink2)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.food{list-style:none;margin:0;padding:0}
.food li{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.food li:last-child{border-bottom:0}
.food .n{font-weight:600}
.food .why{font-size:12px;color:var(--ink2)}
.food .k{font-weight:700;white-space:nowrap}
.food .k small{font-weight:500;color:var(--muted)}
.food .k{text-align:right}.food .k .d{display:block;font-size:11.5px}
.meal-h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:14px}
.daybars{display:flex;flex-direction:column;gap:6px;margin:12px 0 4px}
.mealrow{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;font-size:13px}
.mealrow .ml{color:var(--ink2);font-weight:600}
.mealrow .mb{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.mealrow .mb i{display:block;height:100%;background:var(--accent);border-radius:4px}
.mealrow .mk{font-weight:700;font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.daytot{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:14px}
.daytot div{background:var(--surface);padding:9px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.daytot span{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.daytot b{font-size:14px}
.burnlines{list-style:none;margin:10px 0 0;padding:0;font-size:13px}
.burnlines li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.burnlines li:last-child{border-bottom:0}
.burnlines small{color:var(--muted);font-weight:500}
@media (max-width:520px){.daytot{grid-template-columns:1fr 1fr}.mealrow{grid-template-columns:64px 1fr auto}}
.picks{display:flex;flex-direction:column;gap:2px;max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px;margin-top:6px;background:var(--surface)}
.picks button{border:0;background:transparent;text-align:left;padding:11px 10px;border-radius:8px;display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--ink);min-height:44px;align-items:center;touch-action:manipulation}
.picks button:hover{background:var(--surface2)}
.picks button span{color:var(--muted);white-space:nowrap}
.hist{margin-top:4px;min-height:22px;font-size:12.5px;color:var(--ink2)}
.qty{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.qty .step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.qty .step button{border:0;background:transparent;color:var(--ink);font-size:20px;font-weight:600;width:42px;height:42px;line-height:1;display:grid;place-items:center;touch-action:manipulation}
.qty .step button:hover{background:var(--accent-soft);color:var(--accent)}
.qty .step input{border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);width:58px;height:42px;text-align:center;font-size:15px;font-weight:700;background:var(--surface);color:var(--ink);border-radius:0;padding:0}
.qty .preset{display:flex;gap:4px;flex-wrap:wrap}
.qty .preset button{border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;min-height:38px;touch-action:manipulation}
.qty .preset button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qtot{font-size:12.5px;color:var(--ink2);margin-top:6px}
.qtot b{color:var(--ink)}
.q{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 7px;margin-left:6px;white-space:nowrap;vertical-align:middle}
details.cz{border-top:1px solid var(--line)}
details.cz summary{cursor:pointer;list-style:none;padding:10px 0;display:flex;justify-content:space-between;align-items:center;font-weight:600}
details.cz summary::-webkit-details-marker{display:none}
details.cz .body{padding:0 0 12px;font-size:13.5px;color:var(--ink2)}
details.cz .body b{color:var(--ink)}
.kring{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.kring svg{width:92px;height:92px}
.kring .big{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1}
.kring .big small{font-family:var(--body);font-size:13px;font-weight:600;color:var(--ink2)}
.ai-out{font-size:13px;color:var(--ink2);margin-top:6px;min-height:18px}
.shot{display:flex;gap:10px;align-items:flex-start;margin-top:10px}
.shot img{width:84px;height:84px;object-fit:cover;border-radius:12px;border:1px solid var(--line);flex:none}
.shot .meta{flex:1;min-width:0;font-size:13px;color:var(--ink2)}
.found{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.found .f{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.found .f input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.found .fn{font-weight:600;font-size:14px}
.found .fd{font-size:12px;color:var(--ink2)}
.found .fk{font-weight:700;font-size:13px;white-space:nowrap;text-align:right}
.found .fk small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.thumb{width:38px;height:38px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:none}
.food li.haspic{grid-template-columns:38px 1fr auto auto}
.camerarow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.n[data-ex]{cursor:pointer;text-decoration:underline dotted var(--muted);text-underline-offset:3px}
.n[data-ex]:hover{color:var(--accent)}
.expics{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:4px}
.expics img{height:170px;width:auto;max-width:85%;border-radius:10px;border:1px solid var(--line);background:#fff;flex:none;object-fit:contain}
#exDlg .x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:0 4px}
.cmp{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12.5px;margin-top:6px}
.cmp span{color:var(--muted);font-weight:600}
.cmp a{color:var(--accent);font-weight:600;text-decoration:none}
.rt-list{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto}
.rt-list li{display:grid;grid-template-columns:1fr 84px auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.rt-n{display:flex;flex-direction:column;min-width:0}
.rt-n .n{font-weight:600}
.rt-n small{font-size:11.5px;color:var(--muted)}
.rt-reps{border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:14px;font-weight:700;text-align:center;background:var(--surface);color:var(--ink);width:100%}
.rt-btns{display:flex;gap:2px}
.rt-btns button{border:0;background:var(--surface2);color:var(--ink2);border-radius:6px;width:28px;height:28px;font-size:14px}
.rt-btns button:disabled{opacity:.35}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.olist{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:340px;overflow:auto}
.orow{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;width:100%}
.orow:hover{border-color:var(--accent);background:var(--accent-soft)}
.orow .on{font-weight:600;font-size:14px}
.orow .on em{font-style:normal;color:var(--ink2);font-weight:500}
.orow .od{font-size:12.5px;color:var(--ink2)}
.orow .os{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.bd-l{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink2);margin-top:10px}
.bd-l input{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 10px;font-size:15px}
.bd-rows{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.bd-rows li{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.bd-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bd-n{font-weight:600}
.bd-mid{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.bd-amt{width:64px;border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:15px;font-weight:700;text-align:center;background:var(--surface);color:var(--ink)}
.bd-mid select{border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:14px;background:var(--surface);color:var(--ink);max-width:170px}
.bd-nut{font-size:12.5px;color:var(--ink2)}
.bd-src{font-size:11px;color:var(--muted);margin-top:4px}
.bd-tot{margin-top:12px;font-size:14px;background:var(--surface2);border-radius:10px;padding:10px 12px}
.bd-tot:empty{display:none}
.bd-serv{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13.5px;color:var(--ink2)}
.bd-serv label{display:flex;align-items:center;gap:6px}
.bd-serv input{width:54px;border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:15px;font-weight:700;text-align:center;background:var(--surface);color:var(--ink)}
#bd-meal{border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:14px;background:var(--surface);color:var(--ink)}
.install{background:var(--accent-soft);border:1px solid var(--accent);border-radius:14px;padding:14px;margin-bottom:14px;display:flex;gap:12px;align-items:flex-start}
.install svg{width:26px;height:26px;flex:none;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-top:2px}
.install .t{font-weight:700;color:var(--ink)}
.install .d{font-size:13px;color:var(--ink2);margin-top:2px}
.install ol{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--ink2)}
.install ol li{margin-bottom:3px}
.install .x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 4px;border-radius:6px;align-self:flex-start}
.install .why{margin-top:10px;font-size:12.5px}
.install .why summary{cursor:pointer;color:var(--accent);font-weight:600;list-style:none}
.install .why summary::-webkit-details-marker{display:none}
.diag{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12.5px}
.diag div{display:flex;gap:8px;padding:3px 0;align-items:baseline}
.diag .k{color:var(--ink2);flex:none;width:118px}
.diag .v{font-weight:600;min-width:0;word-break:break-word}
.diag .ok{color:var(--good)} .diag .no{color:var(--bad)} .diag .hm{color:var(--warn)}
.copyurl{margin-top:8px;font-size:12px;color:var(--ink2);word-break:break-all;background:var(--surface2);padding:8px 10px;border-radius:8px}
.lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));gap:6px}
.lock .logo{width:52px;height:52px}
.lock h2{font-size:20px;margin-top:6px}
.lock .sub{font-size:13.5px;color:var(--ink2);text-align:center;max-width:280px;min-height:38px}
.dots{display:flex;gap:12px;margin:14px 0 6px}
.dots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--accent);display:block}
.dots i.on{background:var(--accent)}
.dots.bad i{border-color:var(--bad)} .dots.bad i.on{background:var(--bad)}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-6px)}}
.dots.bad{animation:shake .4s}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:12px;margin-top:10px}
.keys button{height:62px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;touch-action:manipulation}
.keys button:active{background:var(--accent-soft);border-color:var(--accent)}
.keys button.act{border:0;background:transparent;font-size:14px;font-weight:600;color:var(--ink2)}
.lock .foot{margin-top:14px;font-size:12.5px;color:var(--muted);text-align:center;max-width:300px}
.pinbox{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--ink2);border-radius:8px;padding:6px 11px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* today */
.hero{display:flex;flex-direction:column;gap:6px}
.hero .title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hero h2{font-size:24px}
.focus{color:var(--ink2);font-size:14px}
.block{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.block header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.block header .t{font-weight:700}
.block header .m{font-size:12px;color:var(--muted)}
.ex{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ex li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}
.ex li:last-child{border-bottom:0}

  return { id: "r:" + r.id, isRoutine: true, name: r.name, date: "", where: "", reps: "",
    b: [{ t: r.name, x: (r.items || []).map(it => ({ n: it.n, w: "", s: it.reps ? [it.reps] : [], r: it.tip || "" })) }] };
}
function sessionById(id) {
  if (String(id).startsWith("r:")) { const r = (state.routines || []).find(x => x.id === id.slice(2)); return r ? routineAsSession(r) : null; }
  return (state.mywork || []).find(x => x.id === id) || null;
}
function sessExercises(x) { return (x.b || []).flatMap(b => b.x || []); }
function fmtSets(sets) {

  return s.every(v => v === s[0]) ? `${s.length} × ${s[0]}` : s.join(" · ");
}
// A different one of her sessions each week, so the suggestion changes without her asking.
function suggestedSession(offset) {

  if (!list.length) return null;
  const t = new Date(); const mon = new Date(t); mon.setDate(t.getDate() - ((t.getDay() + 6) % 7));
  const wk = Math.floor(mon / 604800000);
  const dayN = ["mon","tue","wed","thu","fri"].indexOf(DOW[t.getDay()]);
  return list[((wk * 5 + Math.max(0, dayN) + (offset || 0)) % list.length + list.length) % list.length];

// Render one of her sessions. With `live`, each move gets a tick box and a swap button.

      const [nm, reps, tip, isSwap] = live ? applySwap(it) : [it[0], it[1], it[2], false];

function sessionSummary(x) {
  const ex = sessExercises(x);
  return `${ex.length} moves${x.where ? " · " + esc(x.where) : ""}${x.reps ? " · " + esc(x.reps.replace(/repetitions/i, "reps")) : ""}`;

// Her own moves, offered in the swap picker next to the built-in ones.
function myAlts() {
  const seen = new Set(ALTS.map(a => swapKey(a[0]))); const out = [];
  for (const x of mySessions()) for (const e of sessExercises(x)) {
    const k = swapKey(e.n); if (seen.has(k)) continue; seen.add(k);
    out.push([e.n, areaOf(e.n), fmtSets(e.s) || "12", [e.w && e.w !== "BW" ? e.w : "", e.r].filter(Boolean).join(" · ") || "From your trainer sessions", [], true]);
  }
  return out;
}

function pickSession(id) {

  if (!cur.includes(id)) { state.picks[iso] = [...cur, id]; persist("picks"); }

/* ---------- my routines: her own lists of moves ---------- */
function exerciseCatalog() {
  const out = [], seen = new Set();
  const push = (n, reps, tip, src) => { const k = swapKey(n); if (!n || seen.has(k)) return; seen.add(k); out.push({ n, reps: reps || "", tip: tip || "", src }); };
  for (const k of ["mon","tue","wed","thu","fri"]) for (const c of PLAN[k].pool || []) for (const it of c.items) push(it[0], it[1], it[2], "plan");
  for (const a of ALTS) push(a[0], a[2], a[3], "library");
  for (const a of myAlts()) push(a[0], a[2], a[3], "trainer");
  return out;
}
let rtEdit = null;   // { id | null, name, items: [{ n, reps, tip }] }

}

    <div class="picks" id="rt-sug" hidden></div>
    ${rtEdit.items.length ? `<ul class="rt-list">${rtEdit.items.map((it, i) => `<li>

function drawAlts() {

  el.innerHTML = list.length ? list.map((a,i) => `<button type="button" data-alt="${ALTS.concat(myAlts()).findIndex(z => z[0] === a[0])}"><div class="an">${esc(a[0])}${a[5] ? ` <em class="yours">yours</em>` : ""}<span>${esc(a[2])}</span></div><div class="at">${esc(a[3] || "")}${swapJoint ? ` <span class="safe">${swapJoint}-safe</span>` : ""}</div></button>`).join("")

  });

  const mine = mySessions();

      <div class="plan" style="margin-top:12px">${mine.map(x => `<details class="day"><summary><div class="dow" style="font-size:11px;line-height:1.15;text-align:center">${esc(parseISO(x.date).toLocaleDateString(undefined, { day: "numeric", month: "short" }))}<br><span style="font-weight:600;opacity:.75">${parseISO(x.date).getFullYear()}</span></div><div><div class="sum-t">${esc(sessExercises(x).slice(0, 3).map(e => e.n).join(", "))}</div><div class="sum-d">${sessionSummary(x)}</div></div><span class="arrow">\u25be</span></summary>
        <div class="body">${sessionHTML(x, true)}<div class="camerarow" style="margin-top:12px"><button class="btn primary sm" data-pick="${x.id}">Add to today</button>${partsP[x.id] ? `<span class="chip good">\u2713 done today</span>` : `<button class="btn sm" type="button" data-mdone="${x.id}">Mark done today</button>`}<button class="btn sm" type="button" data-rtcopy="${x.id}">Copy to my routines</button></div></div></details>`).join("")}</div>`;

  document.querySelectorAll("#screen-plan [data-chk]").forEach(c => c.onchange = () => onTick(c));
  document.querySelectorAll("#screen-plan [data-swap]").forEach(b => b.onclick = () => openSwap(b.dataset.swap));

}

/* ---------- charts ---------- */
function lineChart(el, pts, opts) {
  el.innerHTML = "";
  if (!pts.length) { el.innerHTML = `<div class="empty">${opts.emptyText || "No data yet"}</div>`; return; }
  const W = Math.max(280, el.clientWidth || 600), H = opts.height || 220, m = { t: 14, r: 14, b: 28, l: 40 };
  const xs = pts.map(p => p.x.getTime()); let x0 = Math.min(...xs), x1 = Math.max(...xs);
  if (opts.proj) x1 = Math.max(x1, opts.proj.x.getTime());
  if (x1 - x0 < 86400000 * 7) { x1 = x0 + 86400000 * 7; }
  const ys = pts.map(p => p.y); let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (opts.band) { y0 = Math.min(y0, opts.band[0]); y1 = Math.max(y1, opts.band[1]); }
  if (opts.goal != null) { y0 = Math.min(y0, opts.goal); }
  const pad = Math.max((y1 - y0) * 0.15, opts.minPad || 0.5); y0 -= pad; y1 += pad;
  const X = t => m.l + (t - x0) / (x1 - x0) * (W - m.l - m.r), Y = v => m.t + (y1 - v) / (y1 - y0) * (H - m.t - m.b);
  const ticks = 4; let g = "";
  for (let i = 0; i <= ticks; i++) { const v = y0 + (y1 - y0) * i / ticks; g += `<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">${v.toFixed(opts.dec ?? 1)}</text>`; }
  const nx = Math.min(5, Math.max(2, Math.floor(W / 120)));
  for (let i = 0; i < nx; i++) { const t = x0 + (x1 - x0) * i / (nx - 1); const d = new Date(t); g += `<text x="${X(t)}" y="${H-8}" text-anchor="${i===0?"start":i===nx-1?"end":"middle"}">${d.toLocaleDateString(undefined,{month:"short",day:"numeric"})}</text>`; }
  let band = "";
  if (opts.band) band = `<rect x="${m.l}" width="${W-m.l-m.r}" y="${Y(opts.band[1])}" height="${Y(opts.band[0])-Y(opts.band[1])}" fill="var(--band)" rx="2"/><text x="${W-m.r-4}" y="${Y(opts.band[1])-4}" text-anchor="end" fill="var(--good)" style="fill:var(--good);font-weight:600">goal ${opts.band[0]}–${opts.band[1]}</text>`;
  if (opts.goal != null) band += `<line x1="${m.l}" x2="${W-m.r}" y1="${Y(opts.goal)}" y2="${Y(opts.goal)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${W-m.r-4}" y="${Y(opts.goal)-4}" text-anchor="end" style="fill:var(--good);font-weight:600">${opts.goalLabel||"goal"}</text>`;
  const path = pts.map((p,i) => (i?"L":"M") + X(p.x.getTime()).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" ");
  const area = path + ` L${X(pts[pts.length-1].x.getTime()).toFixed(1)} ${Y(y0)} L${X(pts[0].x.getTime()).toFixed(1)} ${Y(y0)} Z`;
  let proj = "";
  if (opts.proj) { const l = pts[pts.length-1]; proj = `<line x1="${X(l.x.getTime())}" y1="${Y(l.y)}" x2="${X(opts.proj.x.getTime())}" y2="${Y(opts.proj.y)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 4"/><circle cx="${X(opts.proj.x.getTime())}" cy="${Y(opts.proj.y)}" r="4" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.5"/>`; }
  const dots = pts.map((p,i) => `<circle cx="${X(p.x.getTime())}" cy="${Y(p.y)}" r="${i===pts.length-1?5:4}" fill="${i===pts.length-1?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="2"/>`).join("");
  const last = pts[pts.length-1];
  const lastLabel = `<text x="${X(last.x.getTime())}" y="${Y(last.y)-10}" text-anchor="${X(last.x.getTime()) > W-60 ? "end" : "middle"}" style="fill:var(--ink);font-weight:700;font-size:12px">${last.y.toFixed(opts.dec ?? 1)}${opts.unit||""}</text>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${opts.label||""}">${band}${g}<path d="${area}" fill="var(--accent)" opacity=".08"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${proj}${dots}${lastLabel}<line id="xh" x1="0" x2="0" y1="${m.t}" y2="${H-m.b}" stroke="var(--muted)" stroke-width="1" opacity="0"/><rect x="${m.l}" y="${m.t}" width="${W-m.l-m.r}" height="${H-m.t-m.b}" fill="transparent" id="hit"/></svg><div class="tip"></div>`;
  const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), xh = el.querySelector("#xh"), hit = el.querySelector("#hit");
  const move = ev => { const r = svg.getBoundingClientRect(); const sx = (ev.clientX - r.left) * (W / r.width); let best = pts[0], bd = 1e12; for (const p of pts) { const d = Math.abs(X(p.x.getTime()) - sx); if (d < bd) { bd = d; best = p; } } const px = X(best.x.getTime()), py = Y(best.y); xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.setAttribute("opacity", ".6"); tip.textContent = best.x.toLocaleDateString(undefined,{month:"short",day:"numeric"}) + " · " + best.y.toFixed(opts.dec ?? 1) + (opts.unit||""); tip.style.left = (px / W * r.width) + "px"; tip.style.top = (py / H * r.height) + "px"; tip.classList.add("on"); };
  hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => { tip.classList.remove("on"); xh.setAttribute("opacity", "0"); });
}

function barChart(el, pts, opts) {
  el.innerHTML = "";
  if (!pts.some(p => p.y != null)) { el.innerHTML = `<div class="empty">${opts.emptyText || "No data yet"}</div>`; return; }
  const W = Math.max(280, el.clientWidth || 600), H = opts.height || 170, m = { t: 14, r: 10, b: 26, l: 40 };
  const y1 = Math.max(opts.goal * 1.15, ...pts.map(p => p.y || 0)) ; const y0 = 0;
  const iw = (W - m.l - m.r) / pts.length, bw = Math.max(4, iw - 2);
  const Y = v => m.t + (y1 - v) / (y1 - y0) * (H - m.t - m.b);
  let g = ""; for (let i = 0; i <= 3; i++) { const v = y1 * i / 3; g += `<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">${v >= 1000 ? (v/1000).toFixed(v >= 10000 ? 0 : 1) + "k" : Math.round(v)}</text>`; }
  const bars = pts.map((p,i) => { const x = m.l + i * iw + (iw - bw) / 2; const lbl = i % 2 === 0 || pts.length <= 7 ? `<text x="${x + bw/2}" y="${H-8}" text-anchor="middle">${p.x.getDate()}</text>` : ""; if (p.y == null) return lbl; const h = Y(0) - Y(p.y); return `<rect x="${x}" y="${Y(p.y)}" width="${bw}" height="${Math.max(0,h)}" rx="3" fill="${opts.under ? (p.y <= opts.goal ? "var(--good)" : "var(--warn)") : (p.y >= opts.goal ? "var(--good)" : "var(--accent)")}" opacity="${i === pts.length-1 ? 1 : .8}"><title>${p.x.toLocaleDateString(undefined,{month:"short",day:"numeric"})} · ${p.y.toLocaleString()} steps</title></rect>` + lbl; }).join("");
  const goal = `<line x1="${m.l}" x2="${W-m.r}" y1="${Y(opts.goal)}" y2="${Y(opts.goal)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 4"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${opts.label || "Per day"}">${g}${goal}${bars}</svg>`;
}

/* ---------- render: progress ---------- */
function renderProgress() {
  const s = state.settings, S = summary(), P = projection(); const es = sortedEntries();
  const unitLbl = s.unit === "cm" ? "cm" : "in"; const conv = v => s.unit === "cm" ? inToCm(v) : v; const goalLen = conv(s.inchGoal);
  const mt = (label, f, where) => { const m = S.m[f]; if (!m) return `<div class="tile"><div class="eyebrow">${label}</div><div class="v">—</div><div class="d">${where}</div></div>`; const prog = Math.max(0, Math.min(1, -m.delta / s.inchGoal)); return `<div class="tile"><div class="eyebrow">${label}</div><div class="v num ${m.delta<0?"down":m.delta>0?"up":""}">${fmtDelta(conv(m.delta))}<small> ${unitLbl}</small></div><div class="d num">${conv(m.start).toFixed(1)} → ${conv(m.now).toFixed(1)} ${unitLbl} · goal −${goalLen.toFixed(1)}</div><div class="bar"><i style="width:${prog*100}%"></i></div></div>`; };
  const bmiNow = S.cur != null ? S.cur / Math.pow(s.heightCm/100,2) : null; const bmiGoal = ((s.targetLow + s.targetHigh)/2) / Math.pow(s.heightCm/100,2);
  let html = `<div class="tiles">
    <div class="tile"><div class="eyebrow">Weight</div><div class="v num ${S.lost>0?"down":""}">${S.lost != null ? fmtDelta(-S.lost) : "—"}<small> kg</small></div><div class="d num">${S.cur != null ? S.start.toFixed(1) + " → " + S.cur.toFixed(1) + " kg" : "no weigh-in yet"}</div><div class="bar"><i style="width:${S.cur != null ? Math.max(0, Math.min(1, (S.start - S.cur) / Math.max(0.1, S.start - s.targetHigh))) * 100 : 0}%"></i></div></div>
    ${mt("Upper arm","arm","measure relaxed, widest point")}
    ${mt("Thigh","thigh","measure upper thigh, standing")}
    ${mt("Lower belly","belly","2 in below the navel")}
    <div class="tile"><div class="eyebrow">BMI</div><div class="v num">${bmiNow ? bmiNow.toFixed(1) : "—"}<small> → ${bmiGoal.toFixed(1)}</small></div><div class="d">both inside the healthy 18.5–24.9 range</div></div>
    <div class="tile"><div class="eyebrow">Goal date</div><div class="v" style="font-size:18px">${P ? (P.reached ? "Reached ✓" : P.date.toLocaleDateString(undefined,{month:"short",day:"numeric"})) : "—"}</div><div class="d">${P && !P.reached ? "at " + P.basis : P && P.reached ? "maintain: weigh in weekly" : "needs a weigh-in"}</div></div>
  </div>
  <div class="card"><div class="row between"><h3>Weight</h3><span class="chip">${es.filter(e=>e.weight!=null).length} weigh-ins</span></div>
    <div class="chart-wrap" id="chartWeight" style="margin-top:8px"></div>
    <div class="legend"><span><i></i>weight (kg)</span><span><i class="band"></i>goal range</span>${P && !P.reached ? `<span><i class="proj"></i>projection</span>` : ""}</div></div>
  <div class="card"><div class="row between"><h3>Measurements</h3><div class="seg" role="group" aria-label="Units"><button data-unit="in" aria-pressed="${s.unit!=="cm"}">inches</button><button data-unit="cm" aria-pressed="${s.unit==="cm"}">cm</button></div></div>
    <div class="smalls" style="margin-top:10px">
      <div><div class="eyebrow">Upper arm</div><div class="chart-wrap" id="chartArm"></div></div>
      <div><div class="eyebrow">Thigh</div><div class="chart-wrap" id="chartThigh"></div></div>
      <div><div class="eyebrow">Lower belly</div><div class="chart-wrap" id="chartBelly"></div></div>
    </div><p class="focus" style="margin-top:8px">Dashed line is your −${goalLen.toFixed(1)} ${unitLbl} goal for each. Measure in the same spot, same time of day, tape snug but not tight.</p></div>
  <div class="card"><div class="row between"><h3>Steps</h3><span class="chip">last 14 days</span></div><div class="chart-wrap" id="chartSteps" style="margin-top:8px"></div>
    <div class="legend"><span><i></i>steps a day</span><span><i class="proj"></i>goal ${(s.stepGoal||8000).toLocaleString()}</span></div></div>
  <div class="card"><h3>All entries</h3><div class="tbl" style="margin-top:8px">${es.length ? `<table><thead><tr><th>Date</th><th>kg</th><th>Arm</th><th>Thigh</th><th>Belly</th><th>Waist</th><th>Hips</th><th></th></tr></thead><tbody>` +
    [...es].reverse().map(e => `<tr><td>${fmtShort(e.date)}${e.note ? `<div class="tip" style="font-size:11px;color:var(--muted);white-space:normal">${esc(e.note)}</div>` : ""}</td><td class="num">${e.weight != null ? e.weight.toFixed(1) : "—"}</td><td class="num">${e.arm != null ? conv(e.arm).toFixed(1) : "—"}</td><td class="num">${e.thigh != null ? conv(e.thigh).toFixed(1) : "—"}</td><td class="num">${e.belly != null ? conv(e.belly).toFixed(1) : "—"}</td><td class="num">${e.waist != null ? conv(e.waist).toFixed(1) : "—"}</td><td class="num">${e.hips != null ? conv(e.hips).toFixed(1) : "—"}</td><td><button class="del" data-del="${e.id}" aria-label="Delete entry">✕</button></td></tr>`).join("") + `</tbody></table>` : `<div class="empty">No entries yet. Add one on the Log screen.</div>`}</div></div>`;
  $("#screen-progress").innerHTML = html;

  const wpts = es.filter(e => e.weight != null).map(e => ({ x: parseISO(e.date), y: e.weight }));
  lineChart($("#chartWeight"), wpts, { band: [s.targetLow, s.targetHigh], unit: " kg", height: 240, label: "Weight over time", proj: P && !P.reached ? { x: P.date, y: s.targetHigh } : null, emptyText: "Log your first weigh-in to start the chart." });
  for (const [f, id] of [["arm","#chartArm"],["thigh","#chartThigh"],["belly","#chartBelly"]]) {
    const pts = es.filter(e => e[f] != null).map(e => ({ x: parseISO(e.date), y: conv(e[f]) }));
    const st = pts.length ? pts[0].y : null;
    lineChart($(id), pts, { height: 150, unit: " " + unitLbl, minPad: s.unit === "cm" ? 1 : 0.4, goal: st != null ? st - goalLen : null, goalLabel: "−" + goalLen.toFixed(1), label: f + " over time", emptyText: "Add a measurement" });
  }
  barChart($("#chartSteps"), (() => { const out = []; for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); const iso = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); out.push({ x: d, y: state.steps[iso] ?? null }); } return out; })(), { goal: s.stepGoal || 8000, height: 170, emptyText: "Log steps on the Today screen to see them here." });
  document.querySelectorAll("[data-unit]").forEach(b => b.onclick = () => { state.settings.unit = b.dataset.unit; persist("settings"); renderAll(); });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { const e = state.entries.find(x => x.id === b.dataset.del); if (!e) return; if (!confirm("Delete the entry from " + fmtShort(e.date) + "?")) return; state.entries = state.entries.filter(x => x.id !== e.id); persist("entries"); toast("Entry deleted"); renderAll(); });

    ${(state.recipes || []).length ? `<div class="meal-h" style="margin-top:16px">Your recipes and foods</div><ul class="food">${state.recipes.map((r, i) => `<li style="grid-template-columns:1fr auto auto auto"><div><div class="n">${esc(r.name)}</div><div class="why">${r.custom ? "my food, one portion" : (r.parts || []).length + " ingredients"}${r.makes > 1 ? " \u00b7 pot makes " + r.makes : ""}</div></div><div class="k num">${Math.round(r.kcal)}<small> kcal \u00b7 ${Math.round(r.prot || 0)} g${r.chol != null ? " \u00b7 " + Math.round(r.chol) + " mg" : ""}</small></div>${r.custom ? "<span></span>" : `<button class="btn sm" type="button" data-redit="${i}">Edit</button>`}<button class="del" type="button" data-rdel="${i}" aria-label="Delete ${esc(r.name)}">\u2715</button></li>`).join("")}</ul>` : ""}`;

  const q = $("#bd-q"), sug = $("#bd-sug"), res = $("#bd-results");
  const showSug = () => {
    const hits = ingredientMatches(q.value);
    sug.hidden = !hits.length;
    sug.innerHTML = hits.map(x => `<button type="button" data-ing="${INGREDIENTS.indexOf(x)}">${esc(x[0])}<span>${x[1]} kcal \u00b7 ${x[3]} mg / 100 g</span></button>`).join("");
    sug.querySelectorAll("[data-ing]").forEach(b => b.onclick = () => addIngredient(ingredientFromTable(INGREDIENTS[+b.dataset.ing])));
    updateCompare("bd-cmp", q.value || builder.name || "");
  };
  sug.addEventListener("mousedown", e => e.preventDefault());
  q.oninput = showSug;
  q.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); const f = sug.querySelector("[data-ing]"); if (f) f.click(); else if ($("#bd-online")) $("#bd-online").click(); } };
  $("#bd-name").oninput = e => { builder.name = e.target.value; saveBuilder(); };
  const ob = $("#bd-online");
  if (ob) ob.onclick = async () => {
    const term = q.value.trim(); if (term.length < 2) { toast("Type the ingredient first"); q.focus(); return; }
    ob.disabled = true; res.innerHTML = `<p class="focus" style="margin-top:8px">Searching USDA and Open Food Facts\u2026</p>`;
    try {
      const d = await onlineSearch(term); builderOnline = d.results || [];
      res.innerHTML = (builderOnline.length ? `<div class="olist">${builderOnline.map((r, i) => onlineResultHTML(r, i, true)).join("")}</div>` : `<p class="focus" style="margin-top:8px">Nothing found for \u201c${esc(term)}\u201d.</p>`)
        + (d.notes && d.notes.length ? `<p class="focus" style="margin-top:6px;font-size:12px">${esc(d.notes.join(". "))}.</p>` : "");
      res.querySelectorAll("[data-or]").forEach(b => b.onclick = () => { addIngredient(ingredientFromOnline(builderOnline[+b.dataset.or])); });
    } catch (e) { res.innerHTML = `<p class="focus" style="margin-top:8px">Could not search: ${esc(e.message)}</p>`; }
    finally { ob.disabled = false; }
  };
  // Amount or unit changes update that row and the total in place, without rebuilding the form.
  const refresh = i => {
    if (i >= 0) { const r = builder.rows[i], n = rowNut(r), cell = el.querySelector(`[data-bnut="${i}"]`); if (cell) cell.textContent = n ? fmtNut(n) : "check the amount"; }
    const tot = $("#bd-tot"); if (tot) tot.innerHTML = portionHTML();
    saveBuilder();
  };
  const mk = $("#bd-makes"), at = $("#bd-ate");
  if (mk) mk.oninput = () => { builder.makes = mk.value; refresh(-1); };
  if (at) at.oninput = () => { builder.ate = at.value; refresh(-1); };
  el.querySelectorAll("[data-bamt]").forEach(inp => inp.oninput = () => { builder.rows[+inp.dataset.bamt].amount = inp.value; refresh(+inp.dataset.bamt); });
  el.querySelectorAll("[data-bunit]").forEach(sel => sel.onchange = () => { builder.rows[+sel.dataset.bunit].unit = sel.value; refresh(+sel.dataset.bunit); });
  el.querySelectorAll("[data-bdel]").forEach(b => b.onclick = () => { builder.rows.splice(+b.dataset.bdel, 1); saveBuilder(); drawBuilder(); });
  const bm = $("#bd-meal"); if (bm) bm.onchange = () => { builder.meal = bm.value; saveBuilder(); };
  const add = $("#bd-add");
  if (add) add.onclick = () => {
    const P = builderPortion(), t = P.t; if (t.bad) { toast("One of the amounts is not a number"); return; }
    const name = ((builder.name || "").trim() || "Home-made dish") + (P.makes > 1 ? ` (${P.eat} of ${P.makes} servings)` : "");
    const hs = builder.rows.map(r => histCheck(r.name)).filter(Boolean);
    const h = hs.find(x => x.level === "high") || hs[0] || null;
    const iso = foodDate;
    const item = { id: uid(), name, kcal: Math.round(P.eaten.kcal), protein: Math.round(P.eaten.prot), chol: Math.round(P.eaten.chol), fat: r1(P.eaten.fat), qty: 1,
      meal: $("#bd-meal").value, hist: h ? h.level : null, why: h ? h.why : null, t: Date.now(),
      parts: builder.rows.map(r => ({ n: r.name, a: r.amount, u: r.unit })) };
    if (!state.food[iso]) state.food[iso] = [];
    state.food[iso] = [...state.food[iso], item]; pruneFood(); persist("food");
    toast(`Added ${name} \u00b7 ${item.kcal} kcal \u00b7 ${item.fat} g fat \u00b7 ${item.chol} mg cholesterol`);
    builder = { open: false, name: "", rows: [], meal: "", makes: 1, ate: 1 }; saveBuilder(); renderFood();
  };
  const sv = $("#bd-save");
  if (sv) sv.onclick = () => {
    const P = builderPortion(), t = P.t; if (t.bad) { toast("One of the amounts is not a number"); return; }
    const name = (builder.name || "").trim(); if (!name) { toast("Give it a name first"); $("#bd-name").focus(); return; }
    const rec = { id: uid(), name: P.makes > 1 ? name.replace(/\s*\(1 serving\)$/i, "") + " (1 serving)" : name, kcal: Math.round(P.one.kcal), prot: Math.round(P.one.prot), chol: Math.round(P.one.chol), fat: r1(P.one.fat), makes: P.makes, parts: JSON.parse(JSON.stringify(builder.rows)) };
    const at = state.recipes.findIndex(r => r.name.toLowerCase() === name.toLowerCase());
    if (at >= 0) { if (!confirm(`Replace your saved \u201c${state.recipes[at].name}\u201d?`)) return; state.recipes[at] = { ...rec, id: state.recipes[at].id }; }
    else state.recipes = [...state.recipes, rec];
    persist("recipes"); toast(`Saved \u201c${name}\u201d \u2014 type its name in the food box next time`); drawBuilder();
  };
  const cl = $("#bd-clear"); if (cl) cl.onclick = () => { builder.rows = []; builder.name = ""; builder.makes = 1; builder.ate = 1; saveBuilder(); drawBuilder(); };
  el.querySelectorAll("[data-redit]").forEach(b => b.onclick = () => { const r = state.recipes[+b.dataset.redit]; builder = { open: true, name: r.name.replace(/\s*\(1 serving\)$/i, ""), rows: JSON.parse(JSON.stringify(r.parts || [])), meal: builder.meal || "", makes: r.makes || 1, ate: 1 }; saveBuilder(); drawBuilder(); });
  el.querySelectorAll("[data-rdel]").forEach(b => b.onclick = () => { const r = state.recipes[+b.dataset.rdel]; if (!confirm(`Delete your recipe \u201c${r.name}\u201d?`)) return; state.recipes = state.recipes.filter(x => x !== r); persist("recipes"); drawBuilder(); });
  if (focusSearch) { q.focus(); }
}

    const cur = ($("#p-cur") ? $("#p-cur").value : "").trim();
    if (!/^\d{4,6}$/.test(cur)) { toast("Type your current PIN first"); return; }
    if (!confirm("Turn the lock off? Anyone who can reach the app will see your data.")) return;
    if (await savePin(null, await pinDigest(cur))) { pin.required = false; pin.hash = null; pin.unlocked = true; rememberHash(null); toast("Lock turned off"); renderAll(); }
  };
  const plk = $("#p-lock"); if (plk) plk.onclick = () => lockNow();
  $("#settingsForm").onsubmit = ev => { ev.preventDefault(); const lo = +$("#s-low").value, hi = +$("#s-high").value, h = +$("#s-height").value, ig = +$("#s-inch").value, sg = +$("#s-steps").value, kc = $("#s-kcal").value.trim() === "" ? 0 : +$("#s-kcal").value, cl = +$("#s-chol").value || 300, ft = Math.max(0, +$("#s-fat").value || 0); if (!(lo > 0 && hi >= lo && h > 100 && ig > 0 && sg >= 1000 && (kc === 0 || kc >= 1000))) { toast("Check the target numbers"); return; } Object.assign(state.settings, { targetLow: lo, targetHigh: hi, heightCm: h, inchGoal: ig, stepGoal: sg, kcalTarget: kc, cholLimit: cl, fatTarget: ft }); persist("settings"); toast("Targets saved"); renderAll(); };
}

/* ---------- PIN lock ---------- */
const pin = { required: false, hash: null, unlocked: true, serverBacked: false, hiddenAt: 0 };
const RELOCK_MS = 5 * 60 * 1000;   // re-ask after the app has been away this long
async function pinDigest(code) {
  const bytes = new TextEncoder().encode("moveyourbody:" + code);
  const h = await crypto.subtle.digest("SHA-256", bytes);
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function storedHash() { try { return sessionStorage.getItem("sculpt.pinok") || null; } catch { return null; } }
function rememberHash(h) { try { h ? sessionStorage.setItem("sculpt.pinok", h) : sessionStorage.removeItem("sculpt.pinok"); } catch {} }
function pinHeaders(extra) {
  const h = Object.assign({}, extra || {});
  if (pin.serverBacked && pin.hash) h["x-pin"] = pin.hash;
  return h;
}
// Self-hosted: the server decides. Claude copy: the hash rides along in settings.
async function loadPinState() {
  if (STATIC) { pin.required = false; pin.unlocked = true; return; }
  try {
    const r = await fetch("/api/pin", { cache: "no-store" });
    if (r.ok) {
      const d = await r.json();
      pin.serverBacked = true; pin.required = !!d.set;
      pin.hash = storedHash(); pin.unlocked = !pin.required || !!pin.hash;
      return;
    }
  } catch {}
  const h = state.settings.pinHash || null;
  pin.required = !!h; pin.hash = storedHash();
  pin.unlocked = !pin.required || pin.hash === h;
}
async function savePin(newHash, curHash) {
  if (pin.serverBacked) {
    try {
      const h = { "content-type": "application/json" };
      if (curHash) h["x-pin"] = curHash;
      const r = await fetch("/api/pin", { method: "PUT", headers: h, body: JSON.stringify({ hash: newHash }) });
      if (r.status === 401) { toast("That is not your current PIN"); return false; }
      if (!r.ok) { toast("Could not save the PIN"); return false; }
      return true;
    } catch { toast("Could not reach your Mac to save the PIN"); return false; }
  }
  if (pin.required && curHash !== (state.settings.pinHash || null)) { toast("That is not your current PIN"); return false; }
  state.settings.pinHash = newHash; persist("settings"); return true;
}
function lockNow() { if (!pin.required) return; pin.unlocked = false; rememberHash(null); pin.hash = pin.serverBacked ? null : pin.hash; renderLock(); }
let pinEntry = "", pinBad = false, pinBusy = false;
function renderLock() {
  const el = $("#lockScreen"); if (!el) return;
  if (!pin.required || pin.unlocked) { el.hidden = true; document.body.style.overflow = ""; return; }
  el.hidden = false; document.body.style.overflow = "hidden";
  const filled = pinEntry.length;
  el.innerHTML = `<svg class="logo" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="19" fill="none" stroke="var(--accent-soft)" stroke-width="4"/><path d="M22 3a19 19 0 0 1 16.5 28.4" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/><circle cx="24.5" cy="12.5" r="3.1" fill="var(--accent)"/><path d="M25 17.5c-2.6.6-4.6 2-5.6 4.2l-2 4.4M25 17.5c2.4.3 3.9 1.6 4.6 3.6l1.2 3.3 3 1.2M22.6 24.4l3.4 2.2.6 5.1 2.6 4.4M22.6 24.4l-4.9 3.1-3.5 4.2" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h2>Move Your Body</h2>
    <div class="sub" id="lk-sub">${pinBusy ? "Checking…" : pinBad ? "That is not the right PIN. Try again." : "Enter your PIN to open the app."}</div>
    <div class="dots ${pinBad ? "bad" : ""}" aria-hidden="true">${[0,1,2,3,4,5].slice(0, Math.max(4, filled)).map((_, i) => `<i class="${i < filled ? "on" : ""}"></i>`).join("")}</div>
    <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n => `<button type="button" data-k="${n}">${n}</button>`).join("")}
      <button type="button" class="act" data-k="clear">Clear</button>
      <button type="button" data-k="0">0</button>
      <button type="button" class="act" data-k="del" aria-label="Delete">⌫</button></div>
    <div class="foot">Your weight, measurements and meal photos stay behind this PIN.</div>`;
  el.querySelectorAll("[data-k]").forEach(b => b.onclick = () => pinKey(b.dataset.k));
}
async function pinKey(k) {
  if (pinBusy) return;
  pinBad = false;
  if (k === "del") pinEntry = pinEntry.slice(0, -1);
  else if (k === "clear") pinEntry = "";
  else if (pinEntry.length < 6) pinEntry += k;
  renderLock();
  if (pinEntry.length >= 4) {
    const h = await pinDigest(pinEntry);
    const ok = pin.serverBacked ? await tryServerPin(h) : h === (state.settings.pinHash || null);
    if (ok) { pin.hash = h; pin.unlocked = true; rememberHash(h); pinEntry = ""; renderLock(); renderAll(); if (pin.serverBacked) connectApi(); toast("Unlocked"); return; }
    if (pinEntry.length >= 6) { pinBad = true; pinEntry = ""; }
    renderLock();
  }
}
async function tryServerPin(h) {
  pinBusy = true; renderLock();
  try { const r = await fetch("/api/state", { cache: "no-store", headers: { "x-pin": h } }); return r.ok; }
  catch { return false; }
  finally { pinBusy = false; }
}
let bootDay = todayISO();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    const now = todayISO();
    if (now !== bootDay) {
      // A new day started while the app sat open: follow it rather than stranding her on yesterday.
      if (foodDate === bootDay) foodDate = now;
      bootDay = now;
      const lab = $("#todayLabel"); if (lab) lab.textContent = fmtLong(new Date());
      checks = { date: now, on: {} };
      renderAllSafe();
    }
  }
  if (document.visibilityState === "hidden") pin.hiddenAt = Date.now();
  else if (pin.required && pin.unlocked && pin.hiddenAt && Date.now() - pin.hiddenAt > RELOCK_MS) lockNow();
});

/* ---------- install on the phone ---------- */
let deferredInstall = null, swState = "checking…", promptSeen = false;
const framed = (() => { try { return window.top !== window.self; } catch { return true; } })();
function isStandalone() { try { return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true; } catch { return false; } }
// Which browser is this? An in-app browser (a link opened inside another app) has no
// "Add to Home screen" menu at all, which is the usual reason it cannot be found.
function browserInfo() {
  const ua = navigator.userAgent || "";
  const android = /Android/i.test(ua), ios = /iPhone|iPad|iPod/i.test(ua);
  if (/FBAN|FBAV|Instagram|Line\/|Twitter|WhatsApp|Snapchat|MicroMessenger|TikTok/i.test(ua)) return { name: "an in-app browser", inApp: true, android, ios };
  if (android && /\bwv\b/.test(ua)) return { name: "an in-app browser", inApp: true, android, ios };
  if (/EdgA?\//i.test(ua)) return { name: "Edge", inApp: false, android, ios };
  if (/OPR\/|Opera/i.test(ua)) return { name: "Opera", inApp: false, android, ios };
  if (/SamsungBrowser/i.test(ua)) return { name: "Samsung Internet", inApp: false, android, ios, samsung: true };
  if (/Firefox|FxiOS/i.test(ua)) return { name: "Firefox", inApp: false, android, ios, firefox: true };
  if (/CriOS/i.test(ua)) return { name: "Chrome on iPhone", inApp: false, android, ios };
  if (/Chrome\//i.test(ua)) return { name: "Chrome", inApp: false, android, ios, chrome: true };
  if (/Safari/i.test(ua)) return { name: "Safari", inApp: false, android, ios, safari: true };
  return { name: "this browser", inApp: false, android, ios };
}
async function checkSW() {
  if (!("serviceWorker" in navigator)) { swState = "not supported here"; return; }
  try {
    const r = await navigator.serviceWorker.getRegistration();
    swState = r ? (r.active ? "running" : r.installing ? "starting…" : r.waiting ? "waiting" : "registered") : "not registered";
  } catch (e) { swState = "error: " + (e && e.message ? e.message : "unknown"); }
}
function diagRow(k, v, cls) { return `<div><span class="k">${k}</span><span class="v ${cls || ""}">${esc(v)}</span></div>`; }
function renderInstall() {
  const el = $("#installBar"); if (!el) return;
  if (framed || isStandalone() || !/^https?:$/.test(location.protocol)) { el.hidden = true; return; }
  const b = browserInfo();
  const hidden = lsGet("sculpt.installHidden", false);

  if (deferredInstall) {
    el.hidden = false;
    el.innerHTML = `<svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M12 8v7m0 0 3-3m-3 3-3-3"/></svg>
      <div style="flex:1;min-width:0"><div class="t">Put this on your home screen</div><div class="d">It opens full screen, like any other app.</div>
      <div class="camerarow" style="margin-top:10px"><button class="btn primary sm" id="doInstall">Install</button></div></div>
      <button class="x" id="hideInstall" aria-label="Not now">×</button>`;
    $("#doInstall").onclick = async () => {
      const e = deferredInstall; if (!e) return; deferredInstall = null;
      try { e.prompt(); const r = await e.userChoice; toast(r && r.outcome === "accepted" ? "Installing…" : "No problem — you can install later"); }
      catch { toast("Could not start the install"); }
      renderInstall();
    };
    $("#hideInstall").onclick = () => { lsSet("sculpt.installHidden", true); renderInstall(); };
    return;
  }
  if (hidden) { el.hidden = true; return; }

  // No prompt from the browser. Say why, based on what is actually true here.
  let head, steps;
  if (b.inApp) {
    head = "Open this in Chrome first";
    steps = `<div class="d">You are reading this in ${esc(b.name)}, which cannot add apps to your home screen. That is why there is no menu item.</div>
      <ol><li>Tap the three dots in this window.</li><li>Choose <b>Open in Chrome</b> or <b>Open in browser</b>.</li><li>The Install button appears here once Chrome opens it.</li></ol>
      <div class="d" style="margin-top:6px">Or copy this address and paste it into Chrome:</div><div class="copyurl">${esc(location.href)}</div>`;
  } else if (b.firefox) {
    head = "Add this to your home screen";
    steps = `<div class="d">In Firefox:</div><ol><li>Tap the three dots at the bottom right.</li><li>Choose <b>Add to Home screen</b>.</li></ol>
      <div class="d" style="margin-top:6px">Chrome gives a better result. Paste this into Chrome:</div><div class="copyurl">${esc(location.href)}</div>`;
  } else if (b.samsung) {
    head = "Add this to your home screen";
    steps = `<div class="d">In Samsung Internet:</div><ol><li>Tap the three lines at the bottom right.</li><li>Choose <b>Add page to</b>, then <b>Home screen</b>.</li></ol>`;
  } else if (b.ios) {
    head = "Add this to your home screen";
    steps = `<div class="d">On iPhone, use Safari:</div><ol><li>Tap the share button at the bottom.</li><li>Scroll down and choose <b>Add to Home Screen</b>.</li></ol>`;
  } else {
    head = "Add this to your home screen";
    steps = `<div class="d">In Chrome on your phone:</div>
      <ol><li>Tap the three dots at the top right.</li><li>Choose <b>Add to Home screen</b>, or <b>Install app</b> if you see that instead.</li><li>Confirm, and the blue icon appears with your apps.</li></ol>
      <div class="d" style="margin-top:6px">If neither appears, the page may still be loading its offline files. Wait a few seconds and reload once.</div>`;
  }
  el.hidden = false;
  el.innerHTML = `<svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M12 8v7m0 0 3-3m-3 3-3-3"/></svg>
    <div style="flex:1;min-width:0"><div class="t">${esc(head)}</div>${steps}
      <details class="why"><summary>Why is there no Install button?</summary>
        <div class="diag">
          ${diagRow("Browser", b.name, b.inApp ? "no" : "ok")}
          ${diagRow("Secure address", location.protocol === "https:" ? "yes" : "no — needs https", location.protocol === "https:" ? "ok" : "no")}
          ${diagRow("Offline files", swState, swState === "running" ? "ok" : swState === "not registered" || swState.startsWith("error") ? "no" : "hm")}
          ${diagRow("App details", $("#mfTest") ? "" : "checking…", "hm").replace('id="', 'id="mf-row" data-x="')}
          ${diagRow("Install offer", promptSeen ? "received" : "not offered by this browser", promptSeen ? "ok" : "hm")}
          ${diagRow("Address", location.href, "")}
        </div>
        <div class="d" style="margin-top:6px">Send me this list if it still will not install.</div>
      </details></div>
    <button class="x" id="hideInstall" aria-label="Dismiss">×</button>`;
  $("#hideInstall").onclick = () => { lsSet("sculpt.installHidden", true); renderInstall(); };
  // fill the manifest row once it has been fetched and parsed
  fetch("/manifest.webmanifest", { cache: "no-store" }).then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
    .then(m => { const row = el.querySelector("#mf-row .v"); if (row) { row.textContent = (m.name || "?") + ", " + ((m.icons || []).length) + " icons"; row.className = "v ok"; } })
    .catch(e => { const row = el.querySelector("#mf-row .v"); if (row) { row.textContent = "could not read (" + (e.message || "error") + ")"; row.className = "v no"; } });
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; promptSeen = true; lsSet("sculpt.installHidden", false); renderInstall(); });
window.addEventListener("appinstalled", () => { deferredInstall = null; lsSet("sculpt.installHidden", true); renderInstall(); toast("Added to your home screen"); });

/* ---------- tabs & boot ---------- */
function showTab(t) {
  state.tab = t; lsSet("sculpt.tab", t);
  for (const k of ["today","plan","progress","food","log"]) { $("#screen-" + k).hidden = k !== t; $("#tab-" + k).setAttribute("aria-selected", String(k === t)); }
  if (t === "progress") renderProgress();
  if (t === "food") renderFood();
  window.scrollTo({ top: 0 });
}
function typingNow() {
  const a = document.activeElement;
  return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== "checkbox");
}
let rerenderQueued = false;
// Called by background updates. If she is mid-entry, wait until the field loses focus:
// rebuilding the screen under her would wipe what she has typed.
function renderAllSafe() {
  if (typingNow()) { rerenderQueued = true; return; }
  rerenderQueued = false; renderAll();
}
document.addEventListener("focusout", () => { if (rerenderQueued) setTimeout(() => { if (!typingNow()) { rerenderQueued = false; renderAll(); } }, 250); });
function renderAll() { renderStrip(); renderToday(); renderPlan(); if (state.tab === "progress") renderProgress(); if (state.tab === "food") renderFood(); renderLog(); }
document.querySelectorAll(".nav [data-tab]").forEach(b => b.onclick = () => showTab(b.dataset.tab));
$("#todayLabel").textContent = fmtLong(new Date());
loadPinState().then(() => { renderLock(); if (!pin.required || pin.unlocked) renderAll(); });
checkSW().then(() => renderInstall());
setTimeout(() => checkSW().then(renderInstall), 2500);   // give the browser a moment to offer the install prompt
loadLocal(); renderAll(); showTab(["today","plan","progress","food","log"].includes(state.tab) ? state.tab : "today");
let rt, lastW = window.innerWidth;
window.addEventListener("resize", () => {
  // The on-screen keyboard changes the height only. Re-rendering then would destroy the
  // field being typed into, which on a phone looks like the screen blinking.
  if (window.innerWidth === lastW) return;
  lastW = window.innerWidth;
  if (typingNow()) return;
  clearTimeout(rt);
  rt = setTimeout(() => { if (typingNow()) return; if (state.tab === "progress") renderProgress(); if (state.tab === "food") renderFood(); }, 200);
});
connectDb(); connectSample(); checkServerVision();
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  let swReloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (swReloaded || !navigator.serviceWorker.controller) return; swReloaded = true; toast("Updated to the latest version"); setTimeout(() => location.reload(), 800); });
  navigator.serviceWorker.register("sw.js", { scope: "./" })
    .then(() => { swState = "registered"; return navigator.serviceWorker.ready; })
    .then(() => { swState = "running"; renderInstall(); })
    .catch(e => { swState = "error: " + (e && e.message ? e.message : "could not start"); renderInstall(); });
}
</script>
